[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amc-py"
version = "0.1.0"
description = "Python reproduction scaffold for AMC mixed-criticality analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "torch",
    "scikit-learn",
    "joblib",
]

[project.optional-dependencies]
formal = [
    "jsonschema>=4.23,<5",
    "z3-solver>=4.13,<5",
]
dev = [
    "pytest",
    "ruff",
    "black",
    "mypy",
]

[project.scripts]
amc-formal-prove-seed = "formal_toolchain.cli.prove_seed:main"
amc-formal-inspect = "formal_toolchain.cli.inspect_target:main"
amc-formal-compile = "formal_toolchain.cli.compile_seed:main"
amc-formal-verify = "formal_toolchain.cli.verify_bundle:main"
amc-formal-report = "formal_toolchain.cli.render_report:main"
amc-nonvacuity-lab = "nonvacuity_lab.cli:main"

[tool.setuptools.packages.find]
include = ["amc_py*", "formal_toolchain*", "nonvacuity_lab*"]

[tool.setuptools.package-data]
formal_toolchain = ["specs/**/*.json", "theory/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 端到端或耗时较长的测试",
    "real_seed: 需要真实 seed/proof artifact 的实验验收",
    "integration: synthetic cross-module integration tests",
    "requires_z3: requires a working Z3 installation",
    "paper_acceptance: required before producing paper tables",
]
